<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="65%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Outer Casino Chip Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="28 18"/>
  <!-- Inner Felt Circle -->
  <circle cx="256" cy="256" r="174" fill="#064e3b" fill-opacity="0.45" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Spade Symbol -->
  <path d="M256 108 C256 108 146 202 146 268 C146 310 178 338 214 338 C234 338 246 328 256 316 C266 328 278 338 298 338 C334 338 366 310 366 268 C366 202 256 108 256 108 Z" fill="url(#goldGrad)"/>
  <path d="M256 306 L224 388 L288 388 Z" fill="url(#goldGrad)"/>
  <!-- CK Monogram inside Spade -->
  <text x="256" y="282" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" fill="#070b14" letter-spacing="-2">CK</text>
</svg>
