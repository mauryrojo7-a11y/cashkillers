    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) {
                r.unregister();
              });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            });
          }
          fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (res) {
              if (!res.ok) return null;
              return res.json();
            })
            .then(function (data) {
              if (!data || !data.buildId) return;
              var currentBuildId = String(data.buildId);
              var savedBuildId = localStorage.getItem('app_build_id');
              if (savedBuildId !== currentBuildId) {
                localStorage.setItem('app_build_id', currentBuildId);
                if (savedBuildId !== null) {
                  window.location.replace(
                    window.location.pathname + '?v=' + currentBuildId
                  );
                }
              }
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
