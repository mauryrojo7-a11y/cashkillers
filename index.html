<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020617" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="NO MIRES ABAJO: Edición Campeonato Mundial 3D. Equilibrio extremo en rascacielos y malabares en tiempo real."
    />
    <title>NO MIRES ABAJO | World Championship 3D</title>
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }

          fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (res) {
              if (!res.ok) return null;
              return res.json();
            })
            .then(function (data) {
              if (!data || !data.buildId) return;
              var currentBuildId = String(data.buildId);
              var savedBuildId = localStorage.getItem('nma_live_build_id');
              if (savedBuildId && savedBuildId !== currentBuildId) {
                localStorage.setItem('nma_live_build_id', currentBuildId);
                window.location.replace(
                  window.location.pathname + '?v=' + currentBuildId
                );
              } else if (!savedBuildId) {
                localStorage.setItem('nma_live_build_id', currentBuildId);
              }
            })
            .catch(function () {});

          window.addEventListener('load', function () {
            setTimeout(function () {
              var rootEl = document.getElementById('root');
              if (rootEl && !rootEl.hasChildNodes()) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = './assets/index.css?v=' + Date.now();
                document.head.appendChild(link);

                var fallbackScript = document.createElement('script');
                fallbackScript.type = 'module';
                fallbackScript.src = './assets/index.js?v=' + Date.now();
                document.body.appendChild(fallbackScript);
              }
            }, 2200);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body style="margin: 0; background: #020617; overflow: hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
